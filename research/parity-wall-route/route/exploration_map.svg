<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1040" width="1400" height="1040" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect width="1400" height="1040" fill="#ffffff"/>
<text x="700.0" y="44" text-anchor="middle" font-size="25" font-weight="bold" fill="#222">孪生素数奇偶桥 · 探索地图：试过哪些路，为什么不通</text>
<text x="700.0" y="72" text-anchor="middle" font-size="13" font-weight="normal" fill="#666">2026-10-27 · 论文 v0.7 · 所有结论均为 AI 辅助得出：“定理”有完整证明但尚待专家核查，“分析/数值”是判断而非定理</text>
<rect x="40" y="92" width="310" height="40" rx="8" fill="#1e8449"/>
<text x="195.0" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">原始路线：七岛审计</text>
<rect x="40" y="150" width="310" height="70" rx="9" fill="#fdedec" stroke="#c0392b" stroke-width="2.2"/>
<text x="52" y="177" text-anchor="start" font-size="14" font-weight="bold" fill="#222">桥 A（算子桥）</text>
<text x="340" y="177" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">✗ 定理</text>
<text x="52" y="203" text-anchor="start" font-size="12" font-weight="normal" fill="#444">Gate A 就是孪生残差本身</text>
<rect x="40" y="230" width="310" height="70" rx="9" fill="#fdedec" stroke="#c0392b" stroke-width="2.2"/>
<text x="52" y="257" text-anchor="start" font-size="14" font-weight="bold" fill="#222">桥 B（动力学桥）</text>
<text x="340" y="257" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">✗ 定理</text>
<text x="52" y="283" text-anchor="start" font-size="12" font-weight="normal" fill="#444">柱集判据包含了自己的结论</text>
<rect x="40" y="310" width="310" height="70" rx="9" fill="#fdedec" stroke="#c0392b" stroke-width="2.2"/>
<text x="52" y="337" text-anchor="start" font-size="14" font-weight="bold" fill="#222">度量型证书（定理 5.5）</text>
<text x="340" y="337" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">✗ 定理</text>
<text x="52" y="363" text-anchor="start" font-size="12" font-weight="normal" fill="#444">同质量的对抗族：到不了种子点</text>
<rect x="40" y="390" width="310" height="70" rx="9" fill="#d5f5e3" stroke="#27ae60" stroke-width="2.0"/>
<text x="52" y="417" text-anchor="start" font-size="14" font-weight="bold" fill="#222">条件通路（定理 B）</text>
<text x="340" y="417" text-anchor="end" font-size="12" font-weight="bold" fill="#1e8449">✓ 已证</text>
<text x="52" y="443" text-anchor="start" font-size="12" font-weight="normal" fill="#444">GEH + PND_log ⟹ 孪生；显式形式</text>
<rect x="40" y="470" width="310" height="70" rx="9" fill="#d5f5e3" stroke="#27ae60" stroke-width="2.0"/>
<text x="52" y="497" text-anchor="start" font-size="14" font-weight="bold" fill="#222">两边相干（定理 C）</text>
<text x="340" y="497" text-anchor="end" font-size="12" font-weight="bold" fill="#1e8449">✓ 已证</text>
<text x="52" y="523" text-anchor="start" font-size="12" font-weight="normal" fill="#444">粗糙数对上只有一个奇偶参数 δ</text>
<rect x="370" y="92" width="310" height="40" rx="8" fill="#922b21"/>
<text x="525.0" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">奇偶桥：已知机制</text>
<rect x="370" y="150" width="310" height="70" rx="9" fill="#fdedec" stroke="#c0392b" stroke-width="2.2"/>
<text x="382" y="177" text-anchor="start" font-size="14" font-weight="bold" fill="#222">膨胀 + 谱法（定理 A）</text>
<text x="670" y="177" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">✗ 定理</text>
<text x="382" y="203" text-anchor="start" font-size="12" font-weight="normal" fill="#444">Tao / HR / Pilatte：z ≤ exp(O(√log x))</text>
<rect x="370" y="230" width="310" height="70" rx="9" fill="#fdedec" stroke="#c0392b" stroke-width="2.2"/>
<text x="382" y="257" text-anchor="start" font-size="14" font-weight="bold" fill="#222">熵递减（定理 E）</text>
<text x="670" y="257" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">✗ 定理</text>
<text x="382" y="283" text-anchor="start" font-size="12" font-weight="normal" fill="#444">只到 z ≤ (log x)^O(ε⁴)</text>
<rect x="370" y="310" width="310" height="70" rx="9" fill="#fdf2ec" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="2,3"/>
<text x="382" y="337" text-anchor="start" font-size="14" font-weight="bold" fill="#222">LDPT 方案的 L4 环节</text>
<text x="670" y="337" text-anchor="end" font-size="12" font-weight="bold" fill="#a04000">✗ 数值</text>
<text x="382" y="363" text-anchor="start" font-size="12" font-weight="normal" fill="#444">粗糙子图平均度 → 0（x 到 10⁸）</text>
<rect x="370" y="390" width="310" height="70" rx="9" fill="#fdf2ec" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="382" y="417" text-anchor="start" font-size="14" font-weight="bold" fill="#222">FI 双线性假设 (B)</text>
<text x="670" y="417" text-anchor="end" font-size="12" font-weight="bold" fill="#a04000">✗ 分析</text>
<text x="382" y="443" text-anchor="start" font-size="12" font-weight="normal" fill="#444">对孪生"奇偶完备"：μ×μ 或 √x 障碍</text>
<rect x="370" y="470" width="310" height="70" rx="9" fill="#fdf2ec" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="382" y="497" text-anchor="start" font-size="14" font-weight="bold" fill="#222">Lü–Wang–Wu 机制</text>
<text x="670" y="497" text-anchor="end" font-size="12" font-weight="bold" fill="#a04000">✗ 分析</text>
<text x="382" y="523" text-anchor="start" font-size="12" font-weight="normal" fill="#444">只到 z ≤ exp((log x)^(1/5))</text>
<rect x="700" y="92" width="310" height="40" rx="8" fill="#873600"/>
<text x="855.0" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">新对称性筛查（9 类）</text>
<rect x="700" y="150" width="310" height="70" rx="9" fill="#fdedec" stroke="#c0392b" stroke-width="2.2"/>
<text x="712" y="177" text-anchor="start" font-size="14" font-weight="bold" fill="#222">大素数膨胀</text>
<text x="1000" y="177" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">✗ 定理</text>
<text x="712" y="203" text-anchor="start" font-size="12" font-weight="normal" fill="#444">定理 A 的粗糙膨胀情形</text>
<rect x="700" y="230" width="310" height="70" rx="9" fill="#fdf2ec" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="712" y="257" text-anchor="start" font-size="14" font-weight="bold" fill="#222">提取少数大素数</text>
<text x="1000" y="257" text-anchor="end" font-size="12" font-weight="bold" fill="#a04000">✗ 分析</text>
<text x="712" y="283" text-anchor="start" font-size="12" font-weight="normal" fill="#444">落入 √x 障碍（任意系数）</text>
<rect x="700" y="310" width="310" height="70" rx="9" fill="#fdf2ec" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="712" y="337" text-anchor="start" font-size="14" font-weight="bold" fill="#222">Gowers / 高阶 Fourier</text>
<text x="1000" y="337" text-anchor="end" font-size="12" font-weight="bold" fill="#a04000">✗ 分析</text>
<text x="712" y="363" text-anchor="start" font-size="12" font-weight="normal" fill="#444">孪生是无穷复杂度模式</text>
<rect x="700" y="390" width="310" height="70" rx="9" fill="#fdf2ec" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="712" y="417" text-anchor="start" font-size="14" font-weight="bold" fill="#222">自守 / 谱（Kuznetsov）</text>
<text x="1000" y="417" text-anchor="end" font-size="12" font-weight="bold" fill="#a04000">✗ 分析</text>
<text x="712" y="443" text-anchor="start" font-size="12" font-weight="normal" fill="#444">λ 不是自守的，无法转移</text>
<rect x="700" y="470" width="310" height="70" rx="9" fill="#fdf2ec" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="712" y="497" text-anchor="start" font-size="14" font-weight="bold" fill="#222">数域 spin 符号（FI）</text>
<text x="1000" y="497" text-anchor="end" font-size="12" font-weight="bold" fill="#a04000">✗ 分析</text>
<text x="712" y="523" text-anchor="start" font-size="12" font-weight="normal" fill="#444">分裂代数 Q×Q：没有非平凡符号</text>
<rect x="700" y="550" width="310" height="70" rx="9" fill="#fef9e7" stroke="#b7950b" stroke-width="2.0"/>
<text x="712" y="577" text-anchor="start" font-size="14" font-weight="bold" fill="#222">Siegel 零点（Heath-Brown）</text>
<text x="1000" y="577" text-anchor="end" font-size="12" font-weight="bold" fill="#7d6608">条件性</text>
<text x="712" y="603" text-anchor="start" font-size="12" font-weight="normal" fill="#444">仅在 Siegel 零点存在时成立</text>
<rect x="700" y="630" width="310" height="70" rx="9" fill="#fdf2ec" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="712" y="657" text-anchor="start" font-size="14" font-weight="bold" fill="#222">遍历 / Furstenberg 系统</text>
<text x="1000" y="657" text-anchor="end" font-size="12" font-weight="bold" fill="#a04000">✗ 分析</text>
<text x="712" y="683" text-anchor="start" font-size="12" font-weight="normal" fill="#444">粗糙度随尺度变：无固定极限系统</text>
<rect x="700" y="710" width="310" height="70" rx="9" fill="#fdf2ec" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="712" y="737" text-anchor="start" font-size="14" font-weight="bold" fill="#222">Fourier 展开 / Chen 换位</text>
<text x="1000" y="737" text-anchor="end" font-size="12" font-weight="bold" fill="#a04000">✗ 分析</text>
<text x="712" y="763" text-anchor="start" font-size="12" font-weight="normal" fill="#444">只携带 Type I：奇偶原理挡住</text>
<rect x="700" y="790" width="310" height="70" rx="9" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="712" y="817" text-anchor="start" font-size="14" font-weight="bold" fill="#222">函数域 Pellet 公式</text>
<text x="1000" y="817" text-anchor="end" font-size="12" font-weight="bold" fill="#1e8449">✓ 仅函数域</text>
<text x="712" y="843" text-anchor="start" font-size="12" font-weight="normal" fill="#444">μ=(−1)^deg·χ(disc f)；整数无类比</text>
<rect x="1030" y="92" width="310" height="40" rx="8" fill="#1f618d"/>
<text x="1185.0" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">大胆假设（H 系列）</text>
<rect x="1030" y="150" width="310" height="70" rx="9" fill="#fdedec" stroke="#c0392b" stroke-width="2.2"/>
<text x="1042" y="177" text-anchor="start" font-size="14" font-weight="bold" fill="#222">H1 算术导数的 Jacobi 符号</text>
<text x="1330" y="177" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">✗ 定理</text>
<text x="1042" y="203" text-anchor="start" font-size="12" font-weight="normal" fill="#444">恒等式 (n′/n)=(−1)^(k(k−1)/2)</text>
<rect x="1030" y="230" width="310" height="70" rx="9" fill="#fdf2ec" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="1042" y="257" text-anchor="start" font-size="14" font-weight="bold" fill="#222">H2 换奇偶检测函数</text>
<text x="1330" y="257" text-anchor="end" font-size="12" font-weight="bold" fill="#a04000">✗ 分析</text>
<text x="1042" y="283" text-anchor="start" font-size="12" font-weight="normal" fill="#444">由定理 4.1：奇偶只有一维</text>
<rect x="1030" y="310" width="310" height="70" rx="9" fill="#fdf2ec" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="2,3"/>
<text x="1042" y="337" text-anchor="start" font-size="14" font-weight="bold" fill="#222">H5 λ 在粗糙数上低复杂度</text>
<text x="1330" y="337" text-anchor="end" font-size="12" font-weight="bold" fill="#a04000">✗ 数值</text>
<text x="1042" y="363" text-anchor="start" font-size="12" font-weight="normal" fill="#444">实测符号熵 ≈ 每位 1 bit</text>
<rect x="1030" y="390" width="310" height="70" rx="9" fill="#fdedec" stroke="#c0392b" stroke-width="2.2"/>
<text x="1042" y="417" text-anchor="start" font-size="14" font-weight="bold" fill="#222">H3 奇偶线性规划</text>
<text x="1330" y="417" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">✗ 定理</text>
<text x="1042" y="443" text-anchor="start" font-size="12" font-weight="normal" fill="#444">独立延拓：δ=0 世界可行（模型内）</text>
<rect x="1030" y="470" width="310" height="70" rx="9" fill="#fdf2ec" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="2,3"/>
<text x="1042" y="497" text-anchor="start" font-size="14" font-weight="bold" fill="#222">H6 大进位制 Pellet 类比</text>
<text x="1330" y="497" text-anchor="end" font-size="12" font-weight="bold" fill="#a04000">✗ 数值</text>
<text x="1042" y="523" text-anchor="start" font-size="12" font-weight="normal" fill="#444">与数字多项式的函数域 μ 无关（10⁸）</text>
<rect x="1030" y="550" width="310" height="70" rx="9" fill="#f8f9f9" stroke="#999999" stroke-width="1.5" stroke-dasharray="7,5"/>
<text x="1042" y="577" text-anchor="start" font-size="14" font-weight="bold" fill="#222">H7 粗糙尺度二分法</text>
<text x="1330" y="577" text-anchor="end" font-size="12" font-weight="bold" fill="#777777">◌ 低优先</text>
<text x="1042" y="603" text-anchor="start" font-size="12" font-weight="normal" fill="#444">第二分支 = 粗糙数上的 Chowla</text>
<rect x="40" y="882" width="1320" height="62" rx="10" fill="#fef9e7" stroke="#b7950b" stroke-width="2"/>
<text x="700.0" y="908" text-anchor="middle" font-size="15" font-weight="bold" fill="#7d6608">共同障碍：已知的奇偶突破都依赖“许多小素数处的乘性”或整数没有的代数结构；</text>
<text x="700.0" y="931" text-anchor="middle" font-size="15" font-weight="bold" fill="#7d6608">孪生奇偶参数活在 x^η-粗糙、至多 1/η 个素因子的数上，两类资源都缺失。H 系列：H1–H6 均已判死，H7 低优先。</text>
<rect x="40" y="970" width="26" height="16" rx="4" fill="#fdedec" stroke="#c0392b" stroke-width="2.2"/>
<text x="74" y="983" text-anchor="start" font-size="13" font-weight="normal" fill="#333">严格证明不通</text>
<rect x="184" y="970" width="26" height="16" rx="4" fill="#fdf2ec" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="218" y="983" text-anchor="start" font-size="13" font-weight="normal" fill="#333">分析判死</text>
<rect x="300" y="970" width="26" height="16" rx="4" fill="#fdf2ec" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="2,3"/>
<text x="334" y="983" text-anchor="start" font-size="13" font-weight="normal" fill="#333">数值判死</text>
<rect x="416" y="970" width="26" height="16" rx="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="2.0"/>
<text x="450" y="983" text-anchor="start" font-size="13" font-weight="normal" fill="#333">已证（正面结果）</text>
<rect x="588" y="970" width="26" height="16" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="622" y="983" text-anchor="start" font-size="13" font-weight="normal" fill="#333">仅函数域成立</text>
<rect x="732" y="970" width="26" height="16" rx="4" fill="#fef9e7" stroke="#b7950b" stroke-width="2.0"/>
<text x="766" y="983" text-anchor="start" font-size="13" font-weight="normal" fill="#333">条件性成立</text>
<rect x="862" y="970" width="26" height="16" rx="4" fill="#fdebd0" stroke="#e67e22" stroke-width="3.0"/>
<text x="896" y="983" text-anchor="start" font-size="13" font-weight="normal" fill="#333">待测</text>
<rect x="950" y="970" width="26" height="16" rx="4" fill="#f8f9f9" stroke="#999999" stroke-width="1.5" stroke-dasharray="7,5"/>
<text x="984" y="983" text-anchor="start" font-size="13" font-weight="normal" fill="#333">低优先</text>
</svg>